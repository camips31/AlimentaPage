<div class="faq-page">
  <section class="faq-content">
    <div class="container">
      <h1 class="visually-hidden">Preguntas frecuentes</h1>
      <div class="categories-filter">
        @for (category of categories; track category) {
          <button
            type="button"
            class="category-btn"
            [attr.aria-pressed]="selectedCategory === category"
            [class.active]="selectedCategory === category"
            (click)="filterByCategory(category)">
            {{ category }}
          </button>
        }
      </div>

      <div class="faqs-list">
        @for (faq of filteredFaqs; track faq.question) {
          <div class="faq-item" [class.open]="faq.isOpen">
            <button type="button" class="faq-question" [attr.aria-expanded]="faq.isOpen" (click)="toggleFaq(faq)">
              <span class="question-text">{{ faq.question }}</span>
              <span class="toggle-icon">{{ faq.isOpen ? '-' : '+' }}</span>
            </button>
            @if (faq.isOpen) {
              <div class="faq-answer">
                <p>{{ faq.answer }}</p>
              </div>
            }
          </div>
        }
      </div>

      @if (filteredFaqs.length === 0) {
        <div class="no-faqs">
          <p>No hay preguntas en esta categoría todavía.</p>
        </div>
      }
    </div>
  </section>
</div>
