<div class="blog-page">
  <section class="blog-content">
    <div class="container">
      <h1 class="visually-hidden">Artículos de Alimenta</h1>
      <div class="posts-grid">
        @for (post of blogPosts; track post.id) {
          <article class="post-card">
            <div class="post-image">
              <img [src]="post.image" [alt]="post.title" loading="lazy" />

            </div>
            <div class="post-content">
              <span class="topic">{{ post.label }}</span>
              <h2>{{ post.title }}</h2>
              <p>{{ post.excerpt }}</p>
            </div>
            <div class="post-footer">
              <span class="author">Por {{ post.author }}</span>
              <button type="button" (click)="contactWhatsApp(post.title)" [attr.aria-label]="'Consultar por WhatsApp sobre: ' + post.title">
                Consultar <span aria-hidden="true">↗</span>
              </button>
            </div>
          </article>
        }
      </div>
    </div>
  </section>
</div>
