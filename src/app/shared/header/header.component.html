<header class="header">
  <div class="container">
    <nav class="navbar">
      <div class="logo">
        <a routerLink="/" (click)="closeMenu()">
          <img src="assets/logoazul.png" alt="Alimenta" class="logo-img" />
        </a>
      </div>

      <button type="button" aria-label="Abrir o cerrar menú" [attr.aria-expanded]="menuOpen" aria-controls="main-navigation" class="menu-toggle" (click)="toggleMenu()" [class.active]="menuOpen">
        <span></span>
        <span></span>
        <span></span>
      </button>

      <ul id="main-navigation" class="nav-menu" [class.active]="menuOpen">
        <li>
          <a routerLink="/" routerLinkActive="active" [routerLinkActiveOptions]="{exact: true}" (click)="closeMenu()">
            Inicio
          </a>
        </li>
        <li>
          <a routerLink="/sobre-nosotros" routerLinkActive="active" (click)="closeMenu()">
            Nosotros
          </a>
        </li>
        <li>
          <a routerLink="/servicios" routerLinkActive="active" (click)="closeMenu()">
            Servicios
          </a>
        </li>
        <li>
          <a routerLink="/planes" routerLinkActive="active" (click)="closeMenu()">
            Precios
          </a>
        </li>
        <li>
          <a routerLink="/productos" routerLinkActive="active" (click)="closeMenu()">
            Productos
          </a>
        </li>
        <li>
          <a routerLink="/blog" routerLinkActive="active" (click)="closeMenu()">
            Blog
          </a>
        </li>
        <li>
          <a routerLink="/faq" routerLinkActive="active" (click)="closeMenu()">
            FAQ
          </a>
        </li>
        <li>
          <a routerLink="/contacto" routerLinkActive="active" (click)="closeMenu()">
            Contacto
          </a>
        </li>

      </ul>
      <div class="nav-cta" [class.active]="menuOpen">
          <a href="https://wa.me/59178250459?text=Hola%2C%20quiero%20agendar%20una%20consulta" 
             target="_blank" 
             class="btn btn-primary"
             (click)="closeMenu()">
            Agenda Tu Cita
          </a>
          <a routerLink="/empresas"
             routerLinkActive="active"
             class="btn btn-companies"
             (click)="closeMenu()">
            Nutrición con Empresas
          </a>
      </div>
    </nav>
  </div>
</header>
